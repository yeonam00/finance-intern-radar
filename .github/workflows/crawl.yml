name: 금융 인턴 공고 수집

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 밀리는 일이 잦아서 하루 4번(02·08·14·20시 KST)으로 촘촘히 잡음
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul            # 마감일·D-day를 한국 날짜 기준으로 계산
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집 + 대시보드 생성
        run: python -W ignore run.py

      - name: 결과 커밋 (처음 발견한 날짜 기록 유지용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json dashboard.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "수집 $(date +'%Y-%m-%d %H:%M') KST"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Pages용 파일 준비
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
